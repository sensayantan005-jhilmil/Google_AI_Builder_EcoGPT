# ==============================================================================
# Google Cloud Build Pipeline for EcoGPT
# Builds the Docker container, pushes to Artifact Registry / GCR, and deploys to Cloud Run
# ==============================================================================

steps:
  # 1. Build the container image using the multi-stage Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ecogpt:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ecogpt:latest'
      - '.'
    id: 'build-image'

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ecogpt:$COMMIT_SHA'
    id: 'push-image'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ecogpt:latest'
    id: 'push-latest'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ecogpt'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ecogpt:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
    id: 'deploy-cloud-run'

# Store the built images in the registry
images:
  - 'gcr.io/$PROJECT_ID/ecogpt:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ecogpt:latest'

options:
  logging: CLOUD_LOGGING_ONLY
